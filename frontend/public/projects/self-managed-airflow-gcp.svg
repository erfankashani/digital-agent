<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Self-Managed Airflow on GCP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b12"/>
      <stop offset="55%" stop-color="#030303"/>
      <stop offset="100%" stop-color="#0a0710"/>
    </linearGradient>
    <radialGradient id="glowA" cx="78%" cy="30%" r="58%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="20%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Airflow DAG motif, right-hand side (kept clear of the text column) -->
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" fill="none">
    <path d="M 1000 600 L 1150 470"/>
    <path d="M 1150 470 L 1300 560"/>
    <path d="M 1150 470 L 1300 360"/>
    <path d="M 1300 560 L 1450 470"/>
    <path d="M 1300 360 L 1450 470"/>
    <path d="M 1000 600 L 1150 700"/>
    <path d="M 1150 700 L 1300 640"/>
    <path d="M 1300 640 L 1450 470"/>
  </g>
  <g fill="#0b0b12" stroke="#a5b4fc" stroke-opacity="0.7" stroke-width="2">
    <circle cx="1000" cy="600" r="12"/>
    <circle cx="1150" cy="470" r="12"/>
    <circle cx="1150" cy="700" r="12"/>
    <circle cx="1300" cy="560" r="12"/>
    <circle cx="1300" cy="360" r="12"/>
    <circle cx="1300" cy="640" r="12"/>
    <circle cx="1450" cy="470" r="15"/>
  </g>
  <circle cx="1450" cy="470" r="32" fill="none" stroke="#a5b4fc" stroke-opacity="0.22" stroke-width="2"/>

  <rect x="120" y="200" width="72" height="4" rx="2" fill="url(#rule)"/>

  <text x="120" y="270" fill="#ffffff" fill-opacity="0.42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" letter-spacing="6">CASE STUDY</text>

  <text x="120" y="370" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-1">Self-Managed</text>
  <text x="120" y="458" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-1">Airflow on GCP</text>

  <text x="120" y="528" fill="#ffffff" fill-opacity="0.55" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28">Architecture · Terraform · Trade-offs</text>

  <text x="120" y="790" fill="#ffffff" fill-opacity="0.35" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" letter-spacing="1">under $150 / month</text>
</svg>
